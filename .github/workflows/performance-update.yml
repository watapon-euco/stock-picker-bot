name: Performance Dashboard Update

on:
  schedule:
    - cron: '0 2 1 * *'  # 毎月1日 UTC 02:00（メインレポート生成の1時間後）
  workflow_dispatch:       # 手動実行も可能

permissions:
  contents: write          # docs/performance.html への git push に必要

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Step 6 - Generate Backtest Dashboard
        run: python -m src.main --step 6

      - name: Commit and push performance.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/performance.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📈 Auto-update performance dashboard $(date +'%Y-%m')"
            git push
          fi
