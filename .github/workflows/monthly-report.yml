name: Monthly Stock Report

on:
  schedule:
    - cron: '0 1 1 * *'  # 毎月1日 UTC 01:00（JST 10:00）
  workflow_dispatch:       # 手動実行も可能

permissions:
  contents: write          # docs/ への git push に必要

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60    # Claude Batch API の待機を考慮

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true  # Step 3 の git push に必要

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Step 1 - Research (News + Themes + Stocks)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.step1_research

      - name: Step 2 - Report Generation (Claude Batch)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHAT_PROXY_URL: ${{ secrets.CHAT_PROXY_URL }}
        run: python -m src.step2_report

      - name: Step 3 - Deploy to GitHub Pages
        run: python -m src.step3_deploy

      - name: Step 4 - LINE Notification
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          REPORT_URL: ${{ secrets.REPORT_URL }}
        run: python -m src.step4_notify
